name: Build Android APK

# O gatilho: a esteira liga sozinha a cada push na branch main.
# workflow_dispatch permite também apertar o botão "Run workflow" na aba Actions.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK na nuvem
    runs-on: ubuntu-latest   # servidor Linux limpo, criado e destruido a cada execucao

    steps:
      # 1. Clonar o repositorio dentro do runner
      - name: Clonar repositorio
        uses: actions/checkout@v7

      # 2. Injetar o Node.js (ecossistema web / npm)
      # O Capacitor CLI 8 exige Node >=22.
      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # 3. Injetar o Java (motor do Gradle). Capacitor 8 exige JDK 21.
      - name: Instalar JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      # 4. Injetar o Android SDK + aceitar as licencas
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      # 5. Baixar as dependencias do projeto (Capacitor)
      - name: Instalar dependencias
        run: npm install

      # 6. Montar a pasta www/ com os arquivos estaticos do site
      - name: Preparar assets web
        run: npm run build

      # 7. Gerar o projeto nativo Android do zero (nao fica versionado no repo)
      - name: Criar projeto Android
        run: npx cap add android

      # 8. Copiar os assets web para dentro do projeto nativo
      - name: Sincronizar Capacitor
        run: npx cap sync android

      # 9. Gradle assume o controle e gera o binario .apk
      - name: Compilar APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 10. Publicar o artefato para download na aba Actions
      - name: Publicar artefato
        uses: actions/upload-artifact@v7
        with:
          name: constantino-coffee-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
